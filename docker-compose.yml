

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: gobus
      MYSQL_USER: gobus
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10

  backend:
    build: ./gobus-api
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:PUT_YOUR_GENERATED_KEY_HERE"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: gobus
      DB_USERNAME: gobus
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./gobus-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: "http://localhost:8000"
    depends_on:
      - backend

volumes:
  db_data: